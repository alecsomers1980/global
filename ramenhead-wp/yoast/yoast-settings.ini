; Yoast SEO settings import for Ramenhead.
; Import via: WP Admin > SEO > Tools > Import & Export > Import settings.
; Paste the contents of this file into the textarea (or upload it), then Import.
;
; If the import errors out (Yoast occasionally changes its parser), fall back
; to yoast-setup.php — that uses WordPress's update_option() API which is
; bulletproof across Yoast versions.

[wpseo]
website_name = "Ramenhead"
alternate_website_name = "Ramenhead Cape Town"
company_or_person = "company"
company_name = "Ramenhead"
company_alternate_name = "Ramenhead Cape Town"
company_logo = "https://www.ramenhead.co.za/wp-content/uploads/ramenhead/logo.png"
person_name = ""
person_logo = ""
enable_text_link_counter = "on"
enable_admin_bar_menu = "on"
disableadvanced_meta = ""
disable_dashboard_widget = ""

[wpseo_titles]
separator = "sc-pipe"

title-home-wpseo = "Ramenhead | Authentic Japanese Ramen in Cape Town"
metadesc-home-wpseo = "Authentic Japanese ramen in Cape Town. Freshly made noodles and 48-hour broths at Speaker's Corner, 37 Parliament St. Book your slurp today."

; Pages — title pattern "{Page Title} | Ramenhead"
title-page = "%%title%% %%sep%% %%sitename%%"
metadesc-page = ""
noindex-page = "0"
showdate-page = ""
display-metabox-pt-page = "on"

; Single posts (press articles) — "{Post Title} | Ramenhead"
title-post = "%%title%% %%sep%% %%sitename%%"
metadesc-post = ""
noindex-post = "0"
showdate-post = ""
display-metabox-pt-post = "on"

; Media / attachments — noindex (we never want attachment URLs in Google)
title-attachment = "%%title%% %%sep%% %%sitename%%"
noindex-attachment = "1"
display-metabox-pt-attachment = "on"
disable-attachment = "1"

; Category archives — we WANT these indexed (press section navigation)
title-tax-category = "%%term_title%% Press %%sep%% %%sitename%%"
metadesc-tax-category = "%%term_description%%"
noindex-tax-category = "0"
display-metabox-tax-category = "on"

; Tag archives — noindex (we don't use tags)
title-tax-post_tag = "%%term_title%% %%sep%% %%sitename%%"
noindex-tax-post_tag = "1"
display-metabox-tax-post_tag = "on"

; Author archives — single-author site, noindex
title-author-wpseo = "%%name%%, Author at %%sitename%%"
noindex-author-wpseo = "1"
disable-author = "1"

; Date archives — noindex
title-archive-wpseo = "%%date%% Archives %%sep%% %%sitename%%"
noindex-archive-wpseo = "1"
disable-date = "1"

; Search results & 404
title-search-wpseo = "Search for \"%%searchphrase%%\" %%sep%% %%sitename%%"
title-404-wpseo = "Page not found %%sep%% %%sitename%%"

; Breadcrumbs
breadcrumbs-enable = "on"
breadcrumbs-sep = "/"
breadcrumbs-home = "Home"
breadcrumbs-prefix = ""
breadcrumbs-archiveprefix = "Press archives:"
breadcrumbs-searchprefix = "You searched for"
breadcrumbs-404crumb = "Page not found"
breadcrumbs-display-blog-page = ""

; Misc
stripcategorybase = ""
post_types-post-maintax = "category"
forcerewritetitle = ""

[wpseo_social]
opengraph = "on"
twitter = "on"
twitter_card_type = "summary_large_image"

og_default_image = "https://www.ramenhead.co.za/wp-content/uploads/ramenhead/RAMENHEAD-WS-PIC-02.jpg"
og_frontpage_title = "Ramenhead | Authentic Japanese Ramen in Cape Town"
og_frontpage_desc = "Freshly made noodles and 48-hour broths at Speaker's Corner, Cape Town."
og_frontpage_image = "https://www.ramenhead.co.za/wp-content/uploads/ramenhead/RAMENHEAD-WS-PIC-02.jpg"

facebook_site = "https://www.facebook.com/ramenhead.za"
instagram_url = "https://www.instagram.com/ramenhead.za/"
linkedin_url = ""
myspace_url = ""
pinterest_url = ""
twitter_site = ""
youtube_url = ""
wikipedia_url = ""
fbadminapp = ""
