<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vehicle Post</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="post-container">

  <div class="overlay"></div>

  <div class="left-panel">
    <div class="logo-block">
      <div class="logo-circle">
        <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" class="logo-peaks">
          <path d="M 8 50 L 32 18 L 50 38 L 68 8 L 92 50 Z" fill="#fff"/>
        </svg>
      </div>
      <div class="logo-wordmark">EVEREST</div>
      <div class="logo-sub">Motoring</div>
    </div>

    <div class="features">
      {{FEATURES}}
    </div>

    <div class="price-box">
      <div class="price-label">SPECIAL PRICE</div>
      <div class="price">{{PRICE}}</div>
      <div class="price-sub">INCL. VAT</div>
    </div>
  </div>

  <div class="right-panel">

    <div class="heading">
      <div class="year">{{YEAR}} <span class="make">{{MAKE}}</span></div>
      <h1>{{MODEL_MAIN}}</h1>
      <div class="trim">{{MODEL_TRIM}}</div>
      <div class="underline"></div>
      <div class="subtitle">{{SUBTITLE}}</div>
    </div>

    <img src="{{VEHICLE_IMAGE}}" class="vehicle-image" />

    <div class="cta">
      CONTACT <span class="cta-accent">EVEREST MOTORING</span> TODAY
    </div>

    <div class="footer">
      <span class="footer-item"><span class="dot"></span>{{PHONE}}</span>
      <span class="footer-item"><span class="dot"></span>{{EMAIL}}</span>
      <span class="footer-item"><span class="dot"></span>{{WEBSITE}}</span>
    </div>

  </div>

</div>

</body>
</html>
