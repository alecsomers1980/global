<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vehicle Post</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="post-container">

  <div class="overlay"></div>

  <div class="left-panel">
    <div class="logo-block">
      <div class="logo-circle">
        <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" class="logo-peaks">
          <path d="M 8 50 L 32 18 L 50 38 L 68 8 L 92 50 Z" fill="#fff"/>
        </svg>
      </div>
      <div class="logo-wordmark">EVEREST</div>
      <div class="logo-sub">Motoring</div>
    </div>

    <div class="features">
      
        <div class="feature-item">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 9h2V7h12v2h2v6h-2v2H6v-2H4z M9 11v2 M15 11v2"/></svg></span>
            <span class="label">DIESEL</span>
        </div>
    
        <div class="feature-item">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M6 6v12 M12 6v12 M18 6v12 M6 12h12"/></svg></span>
            <span class="label">MANUAL</span>
        </div>
    
        <div class="feature-item">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 18 L9 8 L13 14 L17 6 L21 18 Z"/></svg></span>
            <span class="label">20 200 KM</span>
        </div>
    
        <div class="feature-item">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M7 7v8a3 3 0 003 3h4 M14 7h3v8"/></svg></span>
            <span class="label">WHITE</span>
        </div>
    
        <div class="feature-item">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M8 9a2 2 0 100-4 2 2 0 000 4z M16 9a2 2 0 100-4 2 2 0 000 4z M5 19v-2a4 4 0 014-4h0 M15 13a4 4 0 014 4v2"/></svg></span>
            <span class="label">2025</span>
        </div>
    
    </div>

    <div class="price-box">
      <div class="price-label">SPECIAL PRICE</div>
      <div class="price">R 369 900</div>
      <div class="price-sub">INCL. VAT</div>
    </div>
  </div>

  <div class="right-panel">

    <div class="heading">
      <div class="year">2025 <span class="make">TOYOTA</span></div>
      <h1>HILUX</h1>
      <div class="trim">2.4 GD SINGLE-CAB</div>
      <div class="underline"></div>
      <div class="subtitle">POWER • RELIABILITY • VALUE</div>
    </div>

    <img src="https://txwdlldcteblbejnrmen.supabase.co/storage/v1/object/public/vehicles/vehicles/1777479969623-palke.jpg" class="vehicle-image" />

    <div class="cta">
      CONTACT <span class="cta-accent">EVEREST MOTORING</span> TODAY
    </div>

    <div class="footer">
      <span class="footer-item"><span class="dot"></span>013 854 0600</span>
      <span class="footer-item"><span class="dot"></span>info@everestmotoring.co.za</span>
      <span class="footer-item"><span class="dot"></span>www.everestmotoring.co.za</span>
    </div>

  </div>

</div>

</body>
</html>
