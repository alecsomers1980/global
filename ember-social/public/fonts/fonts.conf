<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Scan this directory for bundled TTF font files (Arial, Arial Bold, Arial Black) -->
  <dir>.</dir>

  <!-- Prefer our bundled Arial over any system fallback -->
  <alias binding="strong">
    <family>Arial</family>
    <prefer>
      <family>Arial</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>Arial Black</family>
    <prefer>
      <family>Arial Black</family>
    </prefer>
  </alias>
</fontconfig>
